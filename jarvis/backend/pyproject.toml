[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS — local autonomous AI operating system for VEYRO Web"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "cryptography>=42",
  "keyring>=24",
]

[project.optional-dependencies]
# Real browser audits (screenshots, mobile layout checks).
browser = ["playwright>=1.44"]
# Local speech: recognition (faster-whisper) and synthesis (Piper).
# PyAV 17+ breaks faster-whisper 1.2 audio decoding (tested): keep it below 17.
voice = ["faster-whisper>=1.1,<2", "av>=12,<17", "piper-tts>=1.3"]
# Always-on wake phrases: microphone capture (PortAudio) + local Whisper.
wake = ["sounddevice>=0.4.6", "numpy>=1.26", "faster-whisper>=1.1,<2", "av>=12,<17"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
jarvis = "jarvis.main:run"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
